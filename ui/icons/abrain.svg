<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#313145"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" stroke="#45475a" stroke-width="2"/>

  <!-- Central node -->
  <circle cx="64" cy="64" r="12" fill="#89b4fa" stroke="#5a8fdc" stroke-width="2"/>

  <!-- Spokes -->
  <line x1="64" y1="52" x2="64" y2="24"  stroke="#585b70" stroke-width="1.5"/>
  <line x1="64" y1="76" x2="64" y2="104" stroke="#585b70" stroke-width="1.5"/>
  <line x1="52" y1="64" x2="24" y2="64"  stroke="#585b70" stroke-width="1.5"/>
  <line x1="76" y1="64" x2="104" y2="64" stroke="#585b70" stroke-width="1.5"/>
  <line x1="55" y1="55" x2="33" y2="33"  stroke="#585b70" stroke-width="1.5"/>
  <line x1="73" y1="55" x2="95" y2="33"  stroke="#585b70" stroke-width="1.5"/>
  <line x1="55" y1="73" x2="33" y2="95"  stroke="#585b70" stroke-width="1.5"/>
  <line x1="73" y1="73" x2="95" y2="95"  stroke="#585b70" stroke-width="1.5"/>

  <!-- Satellite nodes — various statuses -->
  <circle cx="64" cy="20" r="7" fill="#a6e3a1" stroke="#70b870" stroke-width="1.5"/> <!-- resolved -->
  <circle cx="64" cy="108" r="7" fill="#f38ba8" stroke="#c06070" stroke-width="1.5"/> <!-- blocked -->
  <circle cx="20" cy="64" r="7" fill="#fab387" stroke="#c08050" stroke-width="1.5"/> <!-- paused -->
  <circle cx="108" cy="64" r="7" fill="#89b4fa" stroke="#5a8fdc" stroke-width="1.5"/> <!-- started -->
  <circle cx="29" cy="29" r="6" fill="#6c7086" stroke="#888"    stroke-width="1.5"/> <!-- none -->
  <circle cx="99" cy="29" r="6" fill="#a6e3a1" stroke="#70b870" stroke-width="1.5"/>
  <circle cx="29" cy="99" r="6" fill="#89b4fa" stroke="#5a8fdc" stroke-width="1.5"/>
  <circle cx="99" cy="99" r="6" fill="#6c7086" stroke="#888"    stroke-width="1.5"/>
</svg>
